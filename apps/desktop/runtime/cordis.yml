# Native Windows desktop composition. Stdout is reserved for ACP JSON-RPC and
# the WPF shell starts the bundled Node process without a console window.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  config:
    timeoutMs: 60000

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# 预设依赖的宿主服务（与源项目 base.cordis.yml 一致）
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: commands
  name: '@deepseek-ai/dsh-commands'

# 创造模式（cordis 预设）依赖的动态插件运行器
- id: cordis-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: !!js process.env.DSH_DESKTOP_MODEL ?? 'deepseek-v4-pro'
    maxParallelToolCalls: 4
    persistenceRoot: !!js process.env.DSH_SESSION_ROOT
    persistenceCompression: zstd
    dshHome: !!js process.env.DSH_HOME
    workspaceContext:
      maxBytes: 65536
    toolBash: false
    persona: |
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      On Windows, use the PowerShell tool for terminal work. Work autonomously, verify changes,
      and keep answers concise and factual.

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: spill-local
  name: '@deepseek-ai/dsh-spill-local'

- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: 50000

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    maxDepth: 1

- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'
  config:
    subagentProvider: spawn
    maxRounds: 64

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Agent 预设（与源项目一致的四种模式：标准/代码/极简/创造）。
# 预设目录随运行时打包在 <runtime>/presets，由桌面端通过 DSH_RUNTIME_ROOT 提供。
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    roots:
      - path: !!js "process.env.DSH_RUNTIME_ROOT + '/presets'"
        trust: system
    includeUserRoot: false
